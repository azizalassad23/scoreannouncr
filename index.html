<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengumuman Nilai</title>
<meta name="description" content="Ketik NIS kamu dan buka nilaimu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff6b35'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='%2322193a'%3EA%2B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/announce.css">
</head>
<body>

<div class="bg-shapes" aria-hidden="true">
  <span class="shape shape--disc s1"></span>
  <span class="shape shape--pill s2"></span>
  <span class="shape shape--disc s3"></span>
  <span class="shape shape--pill s4"></span>
  <span class="shape shape--ring s5"></span>
</div>

<header class="topbar">
  <span class="brandmark"><span class="brandmark__dot" aria-hidden="true">A+</span>Pengumuman Nilai</span>
  <button class="pn-icon-btn" id="sound-toggle" type="button" aria-pressed="true" aria-label="Suara: nyala">
    <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</header>

<p class="demo-banner" id="demo-banner" hidden>Mode demo: data contoh dari <code>sample.csv</code>. Coba NIS 1001 sampai 1005.</p>

<main>
  <!-- Screen 1: lookup -->
  <section class="screen screen--lookup" id="screen-lookup">
    <h1 class="hero-title">Nilai kamu<br>sudah <span class="hero-hl">keluar!</span></h1>
    <p class="hero-sub">Ketik NIS, tarik napas, lalu buka hasilnya.</p>

    <form class="lookup pn-card" id="lookup-form" novalidate>
      <label class="lookup__field">
        <span class="pn-label">NIS kamu</span>
        <input class="pn-input" id="nis-input" name="nis" inputmode="numeric" autocomplete="off" placeholder="contoh: 1001" required>
      </label>
      <button class="pn-btn pn-btn--primary pn-btn--big" id="lookup-btn" type="submit" disabled>Memuat data…</button>
      <p class="pn-hint" id="lookup-hint" role="status" aria-live="polite">Sedang mengambil data nilai…</p>
    </form>
  </section>

  <!-- Screen 2: reveal, one subject at a time -->
  <section class="screen screen--reveal" id="screen-reveal" hidden>
    <div class="greet">
      <p class="greet__kicker">Halo,</p>
      <h2 class="greet__name" id="greet-name">Kamu!</h2>
      <p class="greet__sub" id="greet-sub">Ada nilai yang menunggu dibuka.</p>
    </div>

    <ol class="steps" id="steps" aria-label="Urutan mapel"></ol>

    <div class="flip" id="flip">
      <div class="flip__inner">
        <button class="face face--front pn-card" id="card-front" type="button">
          <span class="face__subject" id="front-subject">Mapel</span>
          <span class="mystery" aria-hidden="true">?</span>
          <span class="face__tap">Ketuk untuk membuka</span>
        </button>
        <article class="face face--back pn-card" id="card-back">
          <span class="face__subject" id="back-subject">Mapel</span>
          <div class="score-orb" id="score-orb"><span id="score-num">0</span></div>
          <span class="pn-badge stamp" id="tier-badge">Tier</span>
          <p class="tier-msg" id="tier-msg"></p>
          <figure class="media" id="media" hidden><img id="media-img" alt=""></figure>
        </article>
      </div>
    </div>

    <div class="actions">
      <button class="pn-btn pn-btn--primary pn-btn--big" id="next-btn" type="button" hidden>Buka mapel berikutnya</button>
      <button class="pn-btn pn-btn--primary pn-btn--big" id="summary-btn" type="button" hidden>Lihat rekap</button>
    </div>
  </section>

  <!-- Screen 3: summary -->
  <section class="screen screen--summary" id="screen-summary" hidden>
    <h2 class="summary__title">Rekap nilai<br><span id="summary-name">kamu</span></h2>
    <p class="summary__meta" id="summary-meta"></p>
    <ul class="summary__list" id="summary-list"></ul>
    <div class="actions">
      <button class="pn-btn" id="replay-btn" type="button">Putar ulang</button>
      <button class="pn-btn pn-btn--primary" id="again-btn" type="button">Cek NIS lain</button>
    </div>
  </section>
</main>

<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<script src="assets/js/common.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
